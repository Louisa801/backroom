; Backroom: PHP settings for the Docker image (Render). Loaded after php.ini-production.
; Same limits as CLAUDE.md and the local php.ini.

upload_max_filesize = 8M
post_max_size = 90M
memory_limit = 256M

; Never show PHP errors to visitors; log them so they appear in Render's logs.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; The server runs in UTC, like Render. Shop time (Porto, Europe/Lisbon) is handled in
; src/Dashboard.php from a given "now", never from this setting (see CLAUDE.md).
date.timezone = UTC
