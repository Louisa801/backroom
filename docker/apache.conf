# Backroom: Apache settings for the Docker image.

# No version numbers in headers and error pages.
ServerTokens Prod
ServerSignature Off
ServerName localhost

# Only public/ is reachable (the document root); no directory listings, no .htaccess.
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
